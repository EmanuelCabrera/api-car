version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-car
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://user:password@db:3306/car_db
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - seeds_data:/app/data
    networks:
      - car-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! nc -z db 3306; do
          sleep 1
        done &&
        echo 'Database is ready!' &&
        yarn prisma generate &&
        yarn prisma migrate deploy &&
        yarn prisma db push &&
        if [ ! -f /app/.seeds_completed ]; then
          echo 'Running seeds for the first time...' &&
          node dist/prisma/seeds/seed.js &&
          touch /app/.seeds_completed
        else
          echo 'Seeds already completed, skipping...'
        fi &&
        yarn start:prod
      "

  db:
    image: mysql:8.0
    container_name: car-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=car_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - car-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: car-phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - db
    networks:
      - car-network

volumes:
  mysql_data:
  seeds_data:

networks:
  car-network:
    driver: bridge 